<section class="home-page">
  <ng-container *ngIf="!printMode">
    <header class="home-page-header">
      <img [src]="logo.src" [alt]="logo.alt" class="brand-logo" />
      <h1 class="brand-name">{{ header_title }}</h1>
      <h2 class="brand-tagline">{{ header_subtitle }}</h2>
    </header>
  </ng-container>

  <div class="content">
    <div class="form-wrapper">
      <app-color-form
        *ngIf="formState === 1"
        [form]="form"
        [colors]="colors"
        [maxColors]="maxColors"
        (submitted)="onFormSubmitted()"
      ></app-color-form>
    </div>

    <ng-container *ngIf="formState >= 2 && !showPrintModal && !printMode">
      <div class="back-btn-container">
        <button class="btn back-btn" (click)="backToForm()"><span class="icon">⬅️ </span>Back to Form</button>
      </div>
    </ng-container>

    <app-color-selection
      *ngIf="formState >= 2"
      [rows]="colorTableRows"
      [allColors]="colors"
      (rowSelected)="handleRowSelected($event)"
      (colorChanged)="handleColorChange($event)"
    ></app-color-selection>

    <app-painting-grid
      *ngIf="formState >= 2"
      [rowCount]="paintingGridRowCount"
      [colCount]="paintingGridColCount"
      [colorRows]="colorTableRows"
    ></app-painting-grid>

    <ng-container *ngIf="formState >= 2 && !showPrintModal && !printMode">
      <div class="print-btn-container">
        <button class="btn print-btn" (click)="handlePrint()"><span class="icon">🖨️ </span>Print</button>
      </div>
      <div class="print-btn-container">
        <button class="btn reset-btn" (click)="resetForm()"><span class="icon">🔁 </span>Reset</button>
      </div>
    </ng-container>
  </div>
</section>
