<section class="color-management-page">
  <h2>Color Management</h2>

  <form class="add-color-form" [formGroup]="addColorForm" (ngSubmit)="addColor()">
    <label class="form-field">
      Name:
      <input type="text" formControlName="name" placeholder="Color Name" required />
    </label>

    <div class="hex-sync">
      <label class="form-field">
        Picker:
        <input
          type="color"
          [value]="addColorForm.value.hex"
          (input)="onColorPickerChange($event)"
        />
      </label>

      <label class="form-field">
        Hex:
        <input
          type="text"
          formControlName="hex"
          placeholder="#000000"
          pattern="^#([A-Fa-f0-9]{6})$"
        />
      </label>
    </div>

    <button type="submit">Add Color</button>
  </form>

  <div *ngIf="addColorWarning" class="warning">{{ addColorWarning }}</div>

  <table>
    <thead>
    <tr>
      <th>Name</th>
      <th>Hex</th>
      <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let color of colors">
      <td *ngIf="!color.editing">{{ color.name }}</td>

      <td *ngIf="color.editing">
        <input [(ngModel)]="color.name" />
      </td>

      <td *ngIf="!color.editing">
        <div class="hex-display">
          <span class="color-swatch" [style.backgroundColor]="color.hex"></span>
          {{ color.hex }}
        </div>
      </td>

      <td *ngIf="color.editing">
        <input type="color" [(ngModel)]="color.hex" />
      </td>

      <td>
        <div class="color-actions">
          <button *ngIf="!color.editing" class="edit" (click)="enableEdit(color)">Edit</button>
          <button *ngIf="color.editing" class="save" (click)="saveEdit(color)">Save</button>
          <button class="delete" (click)="deleteColor(color)">Delete</button>
        </div>
        <div *ngIf="color.warning" class="warning">{{ color.warning }}</div>
      </td>

    </tr>
    </tbody>
  </table>
</section>
